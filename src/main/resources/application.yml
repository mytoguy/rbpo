spring:
  application:
    name: zadanie1

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:parking_db}
    username: ${DB_USER:parking_app_user}
    password: ${DB_PASSWORD:SuperSecretPassword123!}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true 
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        
  sql:
    init:
      mode: always

server:
  port: 8080